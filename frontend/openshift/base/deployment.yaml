apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/component: frontend
  annotations:
    # Roll out automatically whenever a build pushes a new frontend:latest.
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"frontend:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"frontend\")].image"}]
spec:
  # Keep 2 old ReplicaSets for rollback; the Developer Sandbox allows 30 per project.
  revisionHistoryLimit: 2
  # Static files only, so it can run more than one copy and roll without downtime.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: frontend:latest
          imagePullPolicy: Always
          # Fill in nginx.conf's DNS server and namespace, then run nginx on the result.
          command: ["/bin/sh", "-c"]
          args:
            - >-
              resolver=$(awk '/^nameserver/ {print $2; exit}' /etc/resolv.conf) &&
              sed -e "s/__RESOLVER__/$resolver/" -e "s/__NAMESPACE__/$POD_NAMESPACE/"
              /etc/nginx/templates/nginx.conf > /tmp/nginx.conf &&
              exec nginx -c /tmp/nginx.conf -g 'daemon off;'
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/templates
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        # Generated by kustomize from nginx.conf; its name changes with the content, which rolls the pods.
        - name: nginx-config
          configMap:
            name: frontend-nginx
      terminationGracePeriodSeconds: 10
