# Serves the Angular build on 8080. OpenShift runs the pod as a random non-root user,
# so the pid file and temp files go to /tmp and logs go to stdout/stderr.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    root /opt/app-root/src;
    index index.html;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Angular routes: any path that is not a file gets index.html.
    location / {
      try_files $uri $uri/ /index.html;
    }

    # index.html must not be cached so new builds show up; the hashed bundles can be cached for a year.
    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css)$ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }
  }
}
