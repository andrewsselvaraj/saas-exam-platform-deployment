# Serves the Angular build on 8080 and forwards /api to the api-gateway Service. OpenShift runs the pod as a
# random non-root user, so the pid file and temp files go to /tmp and logs go to stdout/stderr.
# Template: the Deployment replaces __RESOLVER__ (the pod's DNS server) and __NAMESPACE__ at startup.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    root /opt/app-root/src;
    index index.html;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Same-origin API calls, so the gateway needs no CORS. The name is looked up per request (resolver + variable),
    # so nginx starts even before the backend is deployed; until then /api answers 502.
    location /api/ {
      resolver __RESOLVER__ valid=30s ipv6=off;
      set $api_gateway http://api-gateway.__NAMESPACE__.svc.cluster.local:8080;
      proxy_pass $api_gateway;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }

    # Angular routes: any path that is not a file gets index.html.
    location / {
      try_files $uri $uri/ /index.html;
    }

    # index.html must not be cached so new builds show up; the hashed bundles can be cached for a year.
    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css)$ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }
  }
}
