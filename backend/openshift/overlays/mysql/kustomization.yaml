apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Developer Sandbox, with the data services on the existing MySQL schema etfdb_dev (63.142.240.31)
# instead of H2 files on volumes. Needs the backend's MySQL support (driver, *_v_two table names).
#
# Before deploying:
#   - the server must accept connections on 3306 from the cluster's egress IP;
#   - the saas-exam-mysql Secret must hold the MySQL login (shared by the three data services):
#       oc create secret generic saas-exam-mysql \
#         --from-literal=SPRING_DATASOURCE_USERNAME=... --from-literal=SPRING_DATASOURCE_PASSWORD=...
#     The <service>-db Secrets keep the H2 logins, so switching back to overlays/sandbox still works.
resources:
  - ../sandbox

patches:
  # Connect to the existing etfdb_dev schema only. Nothing is ever created in it:
  #   createDatabaseIfNotExist=false  the driver fails instead of creating a missing database
  #   SPRING_FLYWAY_ENABLED=false      no migrations, no tables, no seed data
  #   ddl-auto=validate                Hibernate only checks the existing tables, never changes them
  - target:
      kind: ConfigMap
      name: (catalog|question|exam)-service-config
    patch: |-
      - op: replace
        path: /data/DB_URL
        value: "jdbc:mysql://63.142.240.31:3306/etfdb_dev?createDatabaseIfNotExist=false&sslMode=REQUIRED&connectionTimeZone=UTC"
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"
      - op: add
        path: /data/SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "validate"

  # The data lives on the MySQL server now: use the MySQL login, drop the H2 volumes, and roll updates
  # without stopping the old pod first.
  - target:
      kind: Deployment
      name: (catalog|question|exam)-service
    patch: |-
      # envFrom[1] is the <service>-db Secret in the base Deployment.
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/1/secretRef/name
        value: saas-exam-mysql
      - op: remove
        path: /spec/template/spec/volumes
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts
      - op: replace
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: catalog-service-data
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: question-service-data
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: exam-service-data
