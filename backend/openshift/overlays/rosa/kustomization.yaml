apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ROSA (Red Hat OpenShift Service on AWS) settings on top of the base.
namespace: saas-exam

resources:
  - ../../base

patches:
  # gp3-csi is the default EBS storage class on ROSA.
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: gp3-csi
