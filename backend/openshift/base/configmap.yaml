# Overrides for src/main/resources/application.yml (Spring relaxed binding).
apiVersion: v1
kind: ConfigMap
metadata:
  name: exam-backend-config
  labels:
    app.kubernetes.io/name: exam-backend
data:
  # Same H2 settings as local, but the file lives on the persistent volume mounted at /data.
  SPRING_DATASOURCE_URL: "jdbc:h2:file:/data/examdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE"
  # The H2 web console is a dev tool; keep it off behind a public route.
  SPRING_H2_CONSOLE_ENABLED: "false"
  SERVER_PORT: "8080"
  SERVER_SHUTDOWN: "graceful"
  JAVA_MAX_RAM_RATIO: "75"
