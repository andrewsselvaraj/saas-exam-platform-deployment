apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-service
  labels:
    app.kubernetes.io/component: backend
  annotations:
    # Roll out automatically whenever a build pushes a new exam-service:latest.
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"exam-service:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"exam-service\")].image"}]
spec:
  # H2 in file mode allows one process per database file, and the volume is
  # ReadWriteOnce. Keep a single replica and stop the old pod before starting
  # the new one. Move to a server database (e.g. Amazon RDS) before scaling out.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: exam-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exam-service
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exam-service
          image: exam-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          envFrom:
            - configMapRef:
                name: exam-service-config
            - secretRef:
                name: exam-service-db
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          # The first start runs the Flyway seed migration, hence the long startup window.
          # Spring Boot exposes these health groups automatically when it runs on Kubernetes.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: exam-service-data
      terminationGracePeriodSeconds: 45
