apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The Secret is not listed here on purpose: create it from secret.example.yaml
# (or let scripts/deploy-backend.sh generate it) so credentials never land in git.
resources:
  - imagestream.yaml
  - buildconfig.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: saas-exam-platform
    includeSelectors: false
