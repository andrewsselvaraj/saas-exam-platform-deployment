# Template only, not applied by kustomize. Copy, fill in and apply:
#   oc apply -f secret.yaml
# H2 creates the database with these credentials on first start, so set them
# before the first rollout and keep them stable afterwards.
apiVersion: v1
kind: Secret
metadata:
  name: exam-backend-db
  labels:
    app.kubernetes.io/name: exam-backend
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: examadmin
  SPRING_DATASOURCE_PASSWORD: change-me
