# Overrides for catalog-service's application.yml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-service-config
data:
  PORT: "8081"
  # The existing MySQL schema. The login comes from the saas-exam-mysql Secret.
  # Connect only, never create anything in it:
  #   createDatabaseIfNotExist=false  fail instead of creating a missing database
  #   SPRING_FLYWAY_ENABLED=false      no migrations, no tables, no seed data
  #   ddl-auto=validate                Hibernate only checks the existing tables
  DB_URL: "jdbc:mysql://63.142.240.31:3306/etfdb_dev?createDatabaseIfNotExist=false&sslMode=REQUIRED&connectionTimeZone=UTC"
  SPRING_FLYWAY_ENABLED: "false"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  SERVER_SHUTDOWN: "graceful"
  # Turns on /actuator/health/liveness and /readiness used by the probes.
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  JAVA_MAX_RAM_RATIO: "75"
  QUESTION_SERVICE_URL: "http://question-service:8082"
