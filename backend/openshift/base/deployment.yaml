apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-backend
  labels:
    app.kubernetes.io/name: exam-backend
    app.kubernetes.io/component: backend
  annotations:
    # Roll out automatically whenever a build pushes a new exam-backend:latest.
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"exam-backend:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"exam-backend\")].image"}]
spec:
  # H2 in file mode allows one process per database file, and the volume is
  # ReadWriteOnce. Keep a single replica and stop the old pod before starting
  # the new one. Move to a server database (e.g. Amazon RDS) before scaling out.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: exam-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exam-backend
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exam-backend
          image: exam-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: exam-backend-config
            - secretRef:
                name: exam-backend-db
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          # The app has no actuator, so probes use the lightweight org list.
          # First start runs the Flyway seed migration, hence the long startup window.
          startupProbe:
            httpGet:
              path: /api/orgs
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/orgs
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: exam-backend-data
      terminationGracePeriodSeconds: 45
