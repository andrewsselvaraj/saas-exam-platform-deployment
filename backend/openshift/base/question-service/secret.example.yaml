# Template only, not applied by kustomize (scripts/deploy-backend.sh generates it).
# H2 creates the database with these credentials on first start, so keep them stable afterwards.
apiVersion: v1
kind: Secret
metadata:
  name: question-service-db
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: questionadmin
  SPRING_DATASOURCE_PASSWORD: change-me
